<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hidden Room Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&family=Barlow:wght@300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0c0c0c;
      --brand: #EB6A56;
      --white: #f2f0ec;
      --muted: #888880;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--black);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      padding: 2rem;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3rem, 9vw, 6.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    h1 span { color: var(--brand); display: block; }
    p {
      margin-top: 1.5rem;
      font-size: 1.05rem;
      color: var(--muted);
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--brand);
      text-decoration: none;
      border-bottom: 1px solid var(--brand);
      padding-bottom: 2px;
    }
    a:hover { color: var(--white); border-color: var(--white); }
  </style>
</head>
<body>
  <main>
    <h1>Hidden Room<span>Records</span></h1>
    <p>Hello, world. Something good is coming.</p>
    <a href="https://hiddenroomstudios.com">Hidden Room Studios</a>
  </main>
</body>
</html>
